## Present one camera to PipeWire/WebRTC: the processed Xiaomi Cam endpoint.
## The capture service continues to open the Sonix
## camera directly through its stable /dev/v4l/by-id path, so hiding that
## device from the desktop media graph cannot interrupt capture.

monitor.v4l2.rules = [
  {
    matches = [
      {
        ## WirePlumber match values beginning with !~ are negative regexes.
        ## This also excludes metadata nodes and any later physical webcam;
        ## only the fixed loopback endpoint is a desktop camera candidate.
        api.v4l2.path = "!~^/dev/video42$"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "/dev/video42" }
    ]
    actions = {
      update-props = {
        device.disabled = false
        node.disabled = false
        device.description = "Xiaomi Cam"
        device.nick = "Xiaomi Cam"
        node.description = "Xiaomi Cam"
        node.nick = "Xiaomi Cam"
        node.pause-on-idle = false
        priority.session = 2000
      }
    }
  }
]

## A physical camera rejected by the V4L2 policy must not reappear through
## WirePlumber's libcamera monitor.  The pipeline does not use libcamera; its
## sole physical owner is the system sender's direct V4L2 file descriptor.
monitor.libcamera.rules = [
  {
    matches = [
      { device.name = "~libcamera_device.*" }
      { node.name = "~libcamera_input.*" }
      { node.name = "~libcamera_output.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
