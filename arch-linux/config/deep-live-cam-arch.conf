# Windows CUDA machine. Set this to its reserved/static LAN address.
WINDOWS_HOST=192.168.1.35

# Network nodes used by the native topology display. Android video travels
# directly between the phone and Windows; ADB is only a local management link.
ARCH_HOST=192.168.1.11
ANDROID_BRIDGE_ENABLED=1
ANDROID_HOST=192.168.1.12
ANDROID_ADB_SERIAL=192.168.1.12:46600
ANDROID_MODEL=M2007J3SY
ANDROID_CAMERA_ID=120
ANDROID_BRIDGE_PACKAGE=dev.vcam.app
# Dedicated Android-camera input to the Arch processor.  Android sends a full
# SRT copy here independently of its Windows slot-0 SRT connection.
ANDROID_NATIVE_INPUT_HOST=0.0.0.0
ANDROID_NATIVE_INPUT_PORT=10001
ANDROID_NATIVE_RETURN_PORT=10001
LOCAL_PROCESSOR_CONTROL_SOCKET=/run/deep-live-cam/processor-control.sock
ANDROID_NATIVE_HEALTH_FILE=/run/deep-live-cam/android-phone-processed-health.json
PHONE_RETURN_RELAY_CONTROL_SOCKET=/run/deep-live-cam/phone-return-relay-control.sock
PHONE_RETURN_RELAY_STATE_FILE=/var/lib/deep-live-cam/phone-return-relay.json

# Optional native-256 model pack used by the manager's fixed Arch processor
# target.  If set, the processor validates the hash-pinned local manifest and
# never downloads a model; if absent, Arch remains visibly unavailable/pending
# instead of silently falling back to a different model.
# DLC_NATIVE256_MANIFEST=/var/lib/deep-live-cam/models/dlc_swap256m/manifest.json
# The installer sets processor-scoped paths to the invoking desktop user's
# offline InsightFace cache and Deep-Live-Cam data root when those exist.
PROCESSOR_HOME=/home/arsylk
PROCESSOR_XDG_DATA_HOME=/home/arsylk/.local/share

# This Arch client owns slot 1. Slot N always uses 10000+2N toward Windows
# and the immediately following port for its processed return.
DEVICE_ID=arch-webcam
DEVICE_SLOT=1
WINDOWS_INPUT_PORT=10002
WINDOWS_RETURN_PORT=10003

# Arch initiates this SRT pull from the Windows processor. This makes an
# Android camera selected on Windows available through the same Arch virtual
# cameras without relying on Wi-Fi multicast delivery.
WINDOWS_SELECTED_STREAM_PORT=10010

# Stable udev path discovered on this Arch machine.
PHYSICAL_CAMERA=/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._USB_2.0_Camera_SN0001-video-index0
CAMERA_INPUT_FORMAT=mjpeg
CAMERA_WIDTH=1280
CAMERA_HEIGHT=720
CAMERA_FPS=30

# Measured natural-indoor profile for the Sonix camera. These controls are
# reapplied by the active capture owner after reconnect/reboot.
CAMERA_PROFILE=natural-indoor
CAMERA_BRIGHTNESS=-12
CAMERA_CONTRAST=12
CAMERA_SATURATION=40
CAMERA_HUE=0
CAMERA_GAMMA=95
CAMERA_GAIN=0
CAMERA_SHARPNESS=2
CAMERA_BACKLIGHT=0
CAMERA_POWER_LINE=1
CAMERA_AUTO_EXPOSURE=1
CAMERA_EXPOSURE=157
CAMERA_EXPOSURE_DYNAMIC_FRAMERATE=0
CAMERA_AUTO_WHITE_BALANCE=1
CAMERA_WHITE_BALANCE=4600

# One safe custom v4l2loopback device. It mirrors the physical webcam's
# QUERYCAP driver and USB bus strings while keeping an independent sysfs
# lifetime and stable node. Applications should use the alias, not video42.
VIRTUAL_CAMERA=/dev/deep-live-cam
VIRTUAL_CAMERAS="/dev/deep-live-cam"
LOOPBACK_NODE=/dev/video42

# Retired compatibility switches.  The clean topology never shadows the real
# camera and never allocates the former DroidCam video50 endpoint.  They remain
# explicit so an old installed helper cannot silently re-enable either layout.
SHADOW_ORIGINAL=0
LEGACY_SHADOW=0
DROIDCAM_COMPAT=0

# Fixed LAN wire contract; these must match run_network.py on Windows and the
# Android and other clients use their own isolated slot pairs.
VIDEO_WIDTH=1280
VIDEO_HEIGHT=720
VIDEO_FPS=30
VIDEO_BITRATE=8M
# SRT receiver buffer per hop.  This is a fixed additive latency on every SRT
# link (phone->processor and any processor->phone return).  40ms is a safe
# floor for a stable LAN while still absorbing normal jitter; drop toward the
# 20ms minimum only on a wired/very-clean network.  Raise it again if you see
# tlpktdrop discards or reconnects on a congested link.
SRT_LATENCY_US=40000

# Loopback-only MPEG-TS copy of the exact physical feed sent to Windows.
LOCAL_PREVIEW_PORT=11000

# A second owner-produced copy is reserved for the native manager. Keeping it
# off 11000 means opening/closing the manager cannot split the system mux's
# UDP packets or affect the OS-visible camera.
MANAGER_PREVIEW_PORT=11001

# Private input to the independently reconnecting Windows transport worker.
NETWORK_SOURCE_PORT=11002

# Dedicated owner-produced webcam copy for the local face-swap processor.
# The processor never opens a physical or virtual V4L2 camera device.
NATIVE_PROCESSOR_SOURCE_PORT=11005

# Exact local-model output consumed by the long-lived virtual-camera receiver.
# Its independent copy-only relay lets the manager compare the same encoded
# result without becoming a second consumer of the system source port.
LOCAL_PROCESSED_PORT=11006
LOCAL_PROCESSED_PREVIEW_PORT=11007

# Independent encoded inputs to the one Arch-side owner allowed to call the
# phone's processed-return SRT listener.  11008 comes from the selected Windows
# stream receiver; 11009 comes from the local model encoder.
WINDOWS_PHONE_RELAY_SOURCE_PORT=11008
LOCAL_PHONE_RELAY_SOURCE_PORT=11009
PHONE_RELAY_STALE_SECONDS=3

# Loopback replay of pre-rendered high-quality offline swap output.
LOCAL_PRERECORDED_PORT=11010

# Prefer the Windows processor, with its selected-stream and raw fallbacks.
# This is the first-start fallback only. Runtime selection is atomically kept
# in the service-owned state file and survives receiver restarts without
# restarting or replacing the stable virtual-camera sink.
RECEIVER_SOURCE=windows
RECEIVER_SOURCE_STATE_FILE=/var/lib/deep-live-cam/receiver-source.json

# Receiver-owned copy of the selected Windows stream for the native manager.
# The manager never opens either physical or virtual camera device.
MANAGER_OUTPUT_PREVIEW_PORT=11003

# Exact encoded copy of the local Android processed return. This is a
# dedicated loopback endpoint: 11003 remains owned by the Windows receiver.
ANDROID_NATIVE_PREVIEW_PORT=11004

# Prefer the RX 580's tested VAAPI H.264 encoder, falling back to libx264 if
# the render node or encoder is unavailable.
SENDER_ENCODER=auto
VAAPI_DEVICE=/dev/dri/renderD128
X264_PRESET=ultrafast

# Automatic-recovery thresholds.
RETRY_SECONDS=2
SENDER_STARTUP_TIMEOUT=20
SENDER_STALL_TIMEOUT=10
RECEIVER_STALE_SECONDS=1
STATE_DIR=/run/deep-live-cam
