# A single processed-output camera with the safe parts of the connected Sonix
# webcam's V4L2 identity.  The custom module clones QUERYCAP's UVC driver and
# USB bus strings, but deliberately stays at video42 and never moves itself
# below the physical USB device in sysfs.
options v4l2loopback devices=1 video_nr=42 card_label="Xiaomi Cam" driver_name="uvcvideo" bus_info="usb-0000:02:00.0-4" exclusive_caps=1
