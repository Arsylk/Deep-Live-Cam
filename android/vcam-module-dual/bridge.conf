# Android <-> Windows Deep-Live-Cam bridge defaults.
BRIDGE_ENABLED=1
WINDOWS_HOST=192.168.1.35
WINDOWS_INPUT_PORT=10000
ANDROID_RETURN_PORT=10001
ANDROID_ENCODER_PORT=10020

# Loopback-only encoded feeds. The Camera2 producer selects processed while
# fresh and the phone's own raw feed otherwise, without changing camera IDs.
ANDROID_RAW_CAMERA_PORT=10022
ANDROID_SENDER_FEED_PORT=10023
ANDROID_PROCESSED_FEED_PORT=10024
PROCESSED_STALE_SECONDS=2
PROCESSED_RECOVERY_SECONDS=2

VIDEO_WIDTH=1280
VIDEO_HEIGHT=720
VIDEO_FPS=30
SRT_LATENCY_US=100000
TERMUX_PREFIX=/data/data/com.termux/files/usr

# MJPEG FIFO paths consumed by the vcam_mjpeg_fifo producers and written by
# the bridge-output-selector workers. Both names must stay consistent across
# service.sh, bridge-output-selector.sh, and this file.
VCAM_BACK_FIFO=/data/local/tmp/android-vcam-return.mjpg
VCAM_FRONT_FIFO=/data/local/tmp/android-vcam-return2.mjpg
RETURN_FIFO=/data/local/tmp/android-vcam-return.mjpg
RETURN_FIFO2=/data/local/tmp/android-vcam-return2.mjpg
