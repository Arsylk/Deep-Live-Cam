# Android slot 0 <-> Windows Deep-Live-Cam processor bridge defaults.
BRIDGE_ENABLED=1
# The scoped Camera2 owner sends the phone front camera to the Windows slot-0
# listener. Camera2 120 keeps one stable processed-return/raw-fallback identity.
PHONE_CAPTURE_ENABLED=1
WINDOWS_HOST=192.168.1.35
# Slot 0 always sends to Windows UDP 10000 and receives its paired return on
# Android UDP 10001. The two directions use different hosts and ports.
WINDOWS_INPUT_PORT=10000
ANDROID_RETURN_PORT=10001
ANDROID_ENCODER_PORT=10020

# The Arch processor receives an independent copy of the same hardware-encoded
# Camera2 stream.  It never shares the Windows worker's UDP socket.  Port 10001
# is safe here because it is a listener on the separate Arch host; the return
# with the same number is a listener on this Android host.
ARCH_PROCESSOR_ENABLED=1
ARCH_HOST=192.168.1.11
ARCH_PROCESSOR_INPUT_PORT=10001

# Loopback-only encoded feeds. The Camera2 producer selects processed while
# fresh and the phone's own raw feed otherwise, without changing camera ID 120.
ANDROID_RAW_CAMERA_PORT=10022
ANDROID_SENDER_FEED_PORT=10023
ANDROID_PROCESSED_FEED_PORT=10024
# The return relay copies the complete A/V transport to 10026.  A separate
# worker decodes only its AAC track to mono PCM on 10025 for the per-app Xposed
# microphone redirect.  Keeping that worker separate means missing/malformed
# audio can never interrupt Camera2 ID 120's video.
ANDROID_RETURN_AUDIO_PORT=10025
ANDROID_RETURN_AV_PORT=10026
# Private MPEG-TS copy consumed only by bridge-arch-sender.sh.  A distinct
# datagram destination is mandatory: multiple readers of one UDP socket would
# load-balance packets rather than provide two complete video streams.
ANDROID_ARCH_SENDER_FEED_PORT=10027
RETURN_AUDIO_SAMPLE_RATE=48000
RETURN_AUDIO_CHANNELS=2
PROCESSED_STALE_SECONDS=2
PROCESSED_RECOVERY_SECONDS=2

# Camera2 ID 120 output policy. The manager writes overrides atomically to the
# durable control file; bridge-output-selector.sh observes them without ever
# restarting the provider, loopback node, producer, or an open camera session.
ANDROID_OUTPUT_CONTROL_FILE=/data/adb/android-vcam-output.conf
ANDROID_OUTPUT_STATE_FILE=/data/local/tmp/android-vcam-output.state
ANDROID_OUTPUT_ENABLED=1
ANDROID_OUTPUT_MIRROR=0
ANDROID_OUTPUT_ROTATION=0

VIDEO_WIDTH=1280
VIDEO_HEIGHT=720
VIDEO_FPS=30
SRT_LATENCY_US=100000
TERMUX_PREFIX=/data/data/com.termux/files/usr
